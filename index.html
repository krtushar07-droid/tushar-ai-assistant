<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tushar AI</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050816;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.1);--text:#f5f7ff;--muted:#98a2c6;--panel:#0b1030;--glow:.38;--g:linear-gradient(135deg,#4f7bff,#9b5cff)}
[data-theme=light]{--bg:#f2f4ff;--card:rgba(255,255,255,.85);--card2:#fff;--line:rgba(70,80,160,.15);--text:#10152e;--muted:#5d6791;--panel:#fff;--glow:.2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;max-width:100%;overflow-x:hidden}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;transition:background .25s,color .25s}
body::before,body::after{content:"";position:fixed;width:480px;height:480px;border-radius:50%;filter:blur(110px);opacity:var(--glow);pointer-events:none}
body::before{background:#3d5bff;top:-200px;right:-140px}
body::after{background:#9b3dff;bottom:-220px;left:-160px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top,0);min-width:0;max-width:100%}
header{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line);min-width:0}
.logo{width:44px;height:44px;border-radius:15px;background:var(--g);display:grid;place-items:center;font-weight:800;font-size:23px;color:#fff;flex:none;box-shadow:0 8px 24px rgba(100,90,255,.45)}
.brand{flex:1;min-width:0;font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 14px 10px;scroll-behavior:smooth}
.wrap{max-width:820px;margin:0 auto;min-width:0}
section{min-width:0}
.hero{text-align:center}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid var(--line);background:var(--card);border-radius:14px;color:var(--muted);font-size:14px;font-weight:500}
.pill svg{width:18px;height:18px;color:#8b8bff}
h1{margin-top:20px;font-size:clamp(26px,7.5vw,42px);font-weight:800;letter-spacing:-.025em;line-height:1.15}
.grad{display:inline-block;cursor:pointer;background:linear-gradient(135deg,#7da0ff,#b98aff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
[data-theme=light] .grad{background-image:linear-gradient(135deg,#3b5bff,#8a3dff)}
.sub{color:var(--muted);margin-top:10px;font-size:clamp(15px,4vw,19px)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:26px}
.cat,.sug{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;text-align:left;min-width:0;transition:transform .15s,border-color .15s}
.cat:hover,.sug:hover{transform:translateY(-2px);border-color:rgba(140,130,255,.55)}
.ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.cat{overflow:hidden;padding:12px;gap:10px}
.cat .ic{width:38px;height:38px;border-radius:12px}
.cat .chev{display:none}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:15.5px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.tx span{display:block;margin-top:4px;font-size:13px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.cat .tx b{font-size:14.5px}
.cat .tx span{font-size:12px}
.chev{color:var(--muted);flex:none}
.chev svg{width:18px;height:18px}
.sh{display:flex;align-items:center;justify-content:space-between;margin:28px 2px 12px;gap:8px}
.sh h2{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.sh h2 svg{color:#8b8bff;width:20px;height:20px}
.all{display:flex;align-items:center;gap:4px;padding:8px 14px;border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:14px;font-weight:600;flex:none}
.all svg{width:16px;height:16px}
#sugs{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.sug{padding:12px 14px;border-radius:18px}
.sug .tx b{font-size:15px}
.sug .tx span{font-size:12.5px}
.row{display:flex;gap:10px;align-items:flex-end;margin-bottom:16px;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.row.user{justify-content:flex-end}
.av{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:800;color:#fff}
.av.bot{background:var(--g)}
.av.me{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.bubble{max-width:min(82%,640px);padding:12px 16px;border-radius:20px;line-height:1.55;font-size:15.5px;overflow-wrap:anywhere}
.txt{white-space:pre-wrap}
.txt code{background:var(--card2);padding:1px 6px;border-radius:6px;font-size:.92em}
.user .bubble{background:var(--g);color:#fff;border-bottom-right-radius:6px;box-shadow:0 8px 22px rgba(91,92,255,.3)}
.bot .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.time{display:block;font-size:11.5px;margin-top:6px;opacity:.6}
.dots{display:inline-flex;gap:5px;padding:6px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#8b8bff;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:.5}}
form{padding:8px 12px calc(14px + env(safe-area-inset-bottom,0));min-width:0;max-width:100%}
.cw{position:relative;max-width:820px;margin:0 auto;min-width:0}
#tray{display:flex;flex-wrap:wrap;gap:8px}
#tray:not(:empty){padding-bottom:10px}
.fchip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px 6px;font-size:13.5px;max-width:100%}
.fchip img,.fchip .fi{width:38px;height:38px;border-radius:10px;object-fit:cover;display:grid;place-items:center;background:var(--card2)}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.fchip button{width:26px;height:26px;border-radius:50%;color:var(--muted);font-size:18px}
.composer{display:flex;align-items:center;gap:6px;padding:7px;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1.5px solid rgba(130,120,255,.65);border-radius:999px;box-shadow:0 0 28px rgba(110,100,255,.25);min-width:0}
.composer input[type=text]{flex:1;min-width:0;height:44px;background:transparent;border:0;outline:0;color:var(--text);padding:0 6px;font:inherit;font-size:16px}
.composer input::placeholder{color:var(--muted)}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.plus{border:1px solid var(--line);background:var(--card2)}
.mic{color:var(--text)}
.mic.on{background:#e5484d;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.sep{width:1px;height:24px;background:var(--line);flex:none}
.send{background:var(--g);color:#fff;box-shadow:0 6px 18px rgba(91,92,255,.5)}
.send svg{fill:currentColor;stroke:none}
.send:disabled{opacity:.5}
.pop{position:absolute;left:0;bottom:62px;display:none;flex-direction:column;min-width:200px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 50px rgba(0,0,0,.4);z-index:5}
.pop.open{display:flex;animation:in .15s ease-out}
.pop button{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;font-weight:600;font-size:15px}
.pop button:hover{background:var(--card2)}
.pop .ic{width:36px;height:36px;border-radius:11px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(320px,88vw);background:var(--panel);border-right:1px solid var(--line);z-index:11;transform:translateX(-100%);transition:transform .22s;padding:calc(16px + env(safe-area-inset-top,0)) 14px 16px;display:flex;flex-direction:column;gap:12px}
.drawer.open{transform:none}
.new{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--g);color:#fff;padding:13px;border-radius:14px;font-weight:700;box-shadow:0 8px 24px rgba(91,92,255,.35)}
#q{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 14px;font:inherit;font-size:15px;outline:0}
#history{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.hr{display:flex;align-items:center;border-radius:12px;border:1px solid transparent}
.hr:hover{background:var(--card)}
.hr.active{background:rgba(120,110,255,.16);border-color:rgba(140,130,255,.35)}
.hist{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:11px 10px;text-align:left;font-size:15px}
.hist svg{color:#8b8bff;flex:none;width:19px;height:19px}
.hist span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{padding:10px;color:var(--muted);font-size:20px}
.empty{color:var(--muted);padding:10px;font-size:14px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot a{color:#8b8bff;text-decoration:none;font-weight:600}
@media(min-width:700px){.cats{grid-template-columns:repeat(4,minmax(0,1fr))}.cat{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">T</div>
<div class="brand">Tushar AI<small>Personal AI Assistant</small></div>
<button class="ibtn" id="sBtn" data-ic="search" aria-label="Search chats"></button>
<button class="ibtn" id="tBtn" aria-label="Switch light or dark mode"></button>
<button class="ibtn" id="mBtn" data-ic="menu" aria-label="Menu"></button>
</header>
<div id="scroll"><div class="wrap">
<section id="home">
<div class="hero">
<div class="pill"><span data-ic="spark" style="display:flex"></span>Powered by Microsoft Azure</div>
<h1><span id="greet">Good morning</span>, <span class="grad" id="word" title="Tap to set your name">friend</span></h1>
<p class="sub">What would you like to work on today?</p>
</div>
<div class="cats" id="cats"></div>
<div class="sh"><h2><span data-ic="spark" style="display:flex"></span>Suggested for you</h2><button class="all" id="allBtn">See all <span data-ic="chev" style="display:flex"></span></button></div>
<div id="sugs"></div>
</section>
<div id="msgs"></div>
</div></div>
<form id="form" autocomplete="off"><div class="cw">
<div id="tray"></div>
<div class="pop" id="pop">
<button type="button" id="oCam"><div class="ic" style="--c:#5b8bff" data-ic="cam"></div>Camera</button>
<button type="button" id="oGal"><div class="ic" style="--c:#a98bff" data-ic="gal"></div>Gallery</button>
<button type="button" id="oFile"><div class="ic" style="--c:#ffc247" data-ic="doc"></div>Files</button>
</div>
<div class="composer">
<button class="round plus" id="attach" type="button" data-ic="plus" aria-label="Attach"></button>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>
<input type="file" id="fileIn" accept=".pdf,.txt,.md,.csv,.json,text/plain,application/pdf" multiple hidden>
<input type="text" id="input" placeholder="Message Tushar AI..." aria-label="Message Tushar AI">
<button class="round mic" id="mic" type="button" data-ic="mic" aria-label="Voice input"></button>
<div class="sep"></div>
<button class="round send" id="send" type="submit" data-ic="send" aria-label="Send"></button>
</div>
</div></form>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
<button class="new" id="newChat"><span data-ic="plus" style="display:flex"></span>New Chat</button>
<input id="q" type="search" placeholder="Search chats..." aria-label="Search chats">
<div id="history"></div>
<div class="foot"><span id="who">Signed in</span><a href="/logout">Log out</a></div>
</aside>
<script>
const API='/api/chat';
const $=id=>document.getElementById(id);
const P={search:'M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5',sun:'M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5',moon:'M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z',menu:'M4 7h16M4 12h16M4 17h16',plus:'M12 5v14M5 12h14',chev:'M9 6l6 6-6 6',mic:'M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3zM5 11a7 7 0 0014 0M12 18v3',send:'M21 3L3 10.5l7 2.5 2.5 7z',cam:'M4 8h3l2-3h6l2 3h3v11H4zM12 10a3.5 3.5 0 100 7 3.5 3.5 0 000-7z',gal:'M4 5h16v14H4zM9 10a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM20 16l-5-5-8 8',user:'M12 4a4 4 0 100 8 4 4 0 000-8zM4 21c0-4 4-6 8-6s8 2 8 6',chat:'M21 12a8 8 0 01-11.6 7.1L4 20l1-4.5A8 8 0 1121 12z',spark:'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z',chart:'M5 20V12M12 20V5M19 20v-9',cap:'M2 9l10-5 10 5-10 5zM6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5',doc:'M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5M9 13h6M9 17h6',bulb:'M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z',target:'M12 3a9 9 0 100 18 9 9 0 000-18zM12 8a4 4 0 100 8 4 4 0 000-8z',brief:'M4 8h16v11H4zM9 8V5h6v3M4 13h16',mail:'M3 6h18v12H3zM3 7l9 6 9-6',code:'M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14',pen:'M4 20l4-1L19 8l-3-3L5 16zM14 7l3 3',globe:'M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18'};
const ic=n=>`<svg viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic));

/* Theme */
const root=document.documentElement,tBtn=$('tBtn');
function setTheme(t){root.dataset.theme=t;tBtn.innerHTML=ic(t==='dark'?'sun':'moon');try{localStorage.setItem('tushar_theme',t)}catch(e){}}
let th='dark';try{th=localStorage.getItem('tushar_theme')||'dark'}catch(e){}
setTheme(th);
tBtn.onclick=()=>setTheme(root.dataset.theme==='dark'?'light':'dark');

/* Greeting */
const WORDS=['friend','champ','explorer','genius','trailblazer','thinker','legend','creator','dreamer','achiever'];
let uname='';try{uname=localStorage.getItem('tushar_name')||''}catch(e){}
const rand=WORDS[Math.floor(Math.random()*WORDS.length)];
function greet(){
const h=new Date().getHours();
$('greet').textContent=h<5?'Hello':h<12?'Good morning':h<17?'Good afternoon':h<22?'Good evening':'Hello';
$('word').textContent=uname||rand;
}
$('word').onclick=()=>{
const n=prompt('What should I call you? (leave empty for a surprise word)',uname);
if(n===null)return;uname=n.trim().slice(0,20);
try{localStorage.setItem('tushar_name',uname)}catch(e){}greet();
};
greet();
fetch('/.auth/me').then(r=>r.json()).then(d=>{const u=d.clientPrincipal&&d.clientPrincipal.userDetails;if(u)$('who').textContent=u}).catch(()=>{});

/* Cards & suggestions */
const CATS=[
{t:'Marketing Strategies',d:'Campaigns, content, brand strategy',i:'chart',c:'#4d7bff'},
{t:'MBA Concepts',d:'Notes, frameworks, case studies',i:'cap',c:'#a98bff'},
{t:'Research & Analysis',d:'Reports, data insights, industry trends',i:'doc',c:'#2dd4a0'},
{t:'Business Ideas',d:'Validation, market research, growth',i:'bulb',c:'#ffb23f'}];
const SUGS=[
{t:'Build a marketing strategy',d:'Get a step-by-step plan for your target market',i:'target'},
{t:'Analyze a case study',d:'Get insights, frameworks and key takeaways',i:'doc'},
{t:'Prepare for placement',d:'Mock questions, model answers and tips',i:'brief'},
{t:'Write a professional email',d:'Draft, polish or reply in the right tone',i:'mail'},
{t:'Plan a startup idea',d:'Validate it and outline the first steps',i:'bulb'},
{t:'Explain a concept simply',d:'Break down any topic with examples',i:'cap'},
{t:'Create a study plan',d:'Organize your subjects and exam schedule',i:'pen'},
{t:'Summarize a document',d:'Attach a file and get the key points',i:'doc'},
{t:'Help me debug my code',d:'Find the problem and learn the fix',i:'code'},
{t:'Plan my week',d:'Turn your tasks into a realistic schedule',i:'globe'}];
const COL=['#a98bff','#5b8bff','#c28bff','#2dd4a0','#ffb23f'];
function card(cls,x,col,prompt){
const b=document.createElement('button');b.type='button';b.className=cls;
b.innerHTML=`<div class="ic" style="--c:${col}">${ic(x.i)}</div><div class="tx"><b></b><span></span></div><div class="chev">${ic('chev')}</div>`;
b.querySelector('b').textContent=x.t;b.querySelector('span').textContent=x.d;
b.onclick=()=>{voiceMode=false;ask(prompt)};return b;
}
CATS.forEach(c=>$('cats').appendChild(card('cat',c,c.c,'Help me with '+c.t.toLowerCase()+'.')));
let showAll=false;
function renderSugs(){
$('sugs').innerHTML='';
(showAll?SUGS:SUGS.slice(0,3)).forEach((s,i)=>$('sugs').appendChild(card('sug',s,COL[i%COL.length],s.t+'.')));
$('allBtn').firstChild.textContent=showAll?'Show less ':'See all ';
}
$('allBtn').onclick=()=>{showAll=!showAll;renderSugs()};
renderSugs();

/* Chats (saved in the cloud) */
const msgs=$('msgs'),scroll=$('scroll'),input=$('input'),send=$('send'),mic=$('mic'),tray=$('tray'),pop=$('pop'),
drawer=$('drawer'),scrim=$('scrim'),hist=$('history');
const now=()=>new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const fmt=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
let chats=[],current=null,voiceMode=false,picked=[],loaded=false;
const toBottom=()=>{scroll.scrollTop=scroll.scrollHeight};

async function cloud(method,path,body){
const r=await fetch('/api/chats'+path,{method:method||'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
if(!r.ok)throw new Error('cloud '+r.status);
return r.json();
}
async function saveChat(c){
try{await cloud('PUT','/'+c.id,{title:c.title,lastId:c.lastId,messages:c.messages})}catch(e){console.warn('save failed',e)}
}
async function migrate(){
try{
if(localStorage.getItem('tushar_migrated'))return;
const old=JSON.parse(localStorage.getItem('tushar_chats')||'[]');
for(const c of old.slice(0,50)){
if(c&&c.id&&Array.isArray(c.messages))await cloud('PUT','/'+String(c.id).replace(/[^A-Za-z0-9_-]/g,'').slice(0,40),{title:c.title||'Chat',lastId:c.lastId||null,messages:c.messages});
}
localStorage.setItem('tushar_migrated','1');
}catch(e){console.warn('migrate skipped',e)}
}
async function loadList(){
try{chats=await cloud('','');loaded=true}catch(e){console.warn('list failed',e)}
renderHistory();
}

function addMsg(text,who,time){
const row=document.createElement('div');row.className='row '+who;
const av=`<div class="av ${who==='user'?'me':'bot'}">${who==='user'?ic('user').replace('<svg','<svg style="width:19px;height:19px"'):'T'}</div>`;
const b=document.createElement('div');b.className='bubble';
const x=document.createElement('div');x.className='txt';
if(who==='bot')x.innerHTML=fmt(text);else x.textContent=text;
const t=document.createElement('span');t.className='time';t.textContent=time||now();
b.append(x,t);
row.innerHTML=who==='user'?'':av;row.appendChild(b);
if(who==='user')row.insertAdjacentHTML('beforeend',av);
msgs.appendChild(row);toBottom();return b;
}
const setBot=(b,t)=>{b.querySelector('.txt').innerHTML=fmt(t)};
function showHome(on){$('home').style.display=on?'':'none'}

function renderHistory(){
const q=$('q').value.trim().toLowerCase();
hist.innerHTML='';
const list=chats.filter(c=>(c.title||'').toLowerCase().includes(q));
if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent=!loaded&&!chats.length?'Loading...':chats.length?'No matching chats':'No chats yet';hist.appendChild(e);return}
list.forEach(c=>{
const r=document.createElement('div');r.className='hr'+(current&&current.id===c.id?' active':'');
const o=document.createElement('button');o.className='hist';
o.innerHTML=ic('chat')+'<span></span>';o.querySelector('span').textContent=c.title;
o.onclick=()=>openChat(c.id);
const d=document.createElement('button');d.className='del';d.textContent='×';d.setAttribute('aria-label','Delete chat');
d.onclick=e=>{e.stopPropagation();deleteChat(c.id)};
r.append(o,d);hist.appendChild(r);
});
}
$('q').oninput=renderHistory;
function closeDrawer(){drawer.classList.remove('open');scrim.classList.remove('open')}
function openDrawer(){drawer.classList.add('open');scrim.classList.add('open')}
$('mBtn').onclick=openDrawer;scrim.onclick=closeDrawer;
$('sBtn').onclick=()=>{openDrawer();setTimeout(()=>$('q').focus(),250)};
function newChat(){current=null;msgs.innerHTML='';showHome(true);scroll.scrollTop=0;renderHistory();closeDrawer()}
async function openChat(id){
closeDrawer();
msgs.innerHTML='';showHome(false);
const tmp=addMsg('Loading chat...','bot');
try{
const c=await cloud('','/'+id);
current=c;msgs.innerHTML='';
c.messages.forEach(m=>addMsg(m.text,m.who,m.time));
}catch(e){setBot(tmp,'Could not load this chat. Check your connection and try again.')}
renderHistory();toBottom();
}
async function deleteChat(id){
try{await cloud('DELETE','/'+id)}catch(e){alert('Could not delete. Check your connection.');return}
chats=chats.filter(c=>c.id!==id);
if(current&&current.id===id)newChat();else renderHistory();
}
$('newChat').onclick=newChat;

/* Attachments */
function renderTray(){
tray.innerHTML='';
picked.forEach((f,i)=>{
const c=document.createElement('div');c.className='fchip';
if(f.kind==='image'){const im=document.createElement('img');im.src=f.data;c.appendChild(im)}
else{const d=document.createElement('div');d.className='fi';d.textContent='📄';c.appendChild(d)}
const s=document.createElement('span');s.textContent=f.name;
const x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label','Remove');
x.onclick=()=>{picked.splice(i,1);renderTray()};
c.append(s,x);tray.appendChild(c);
});
}
const rd=(f,m)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r[m](f)});
const readImage=f=>new Promise((res,rej)=>{
const img=new Image(),u=URL.createObjectURL(f);
img.onload=()=>{
const s=Math.min(1,1280/Math.max(img.width,img.height));
const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85));
};
img.onerror=rej;img.src=u;
});
async function addFiles(list){
for(const f of list){
try{
if(f.type.startsWith('image/'))picked.push({name:f.name||'photo.jpg',kind:'image',type:'image/jpeg',data:await readImage(f)});
else if(f.type==='application/pdf'){
if(f.size>5e6){alert(f.name+' is over 5 MB.');continue}
picked.push({name:f.name,kind:'file',type:f.type,data:await rd(f,'readAsDataURL')});
}else if(/\.(txt|md|csv|json)$/i.test(f.name)||f.type.startsWith('text/'))
picked.push({name:f.name,kind:'text',text:(await rd(f,'readAsText')).slice(0,20000)});
else alert(f.name+' is not supported. Use images, PDF, or text files.');
}catch(e){alert('Could not read '+f.name)}
}
renderTray();
}
[['camIn','oCam'],['galIn','oGal'],['fileIn','oFile']].forEach(([i,b])=>{
$(b).onclick=()=>{pop.classList.remove('open');$(i).click()};
$(i).onchange=async e=>{await addFiles([...e.target.files]);e.target.value=''};
});
$('attach').onclick=e=>{e.stopPropagation();pop.classList.toggle('open')};
document.addEventListener('click',e=>{if(!pop.contains(e.target))pop.classList.remove('open')});

/* Ask */
async function getReply(text,prevId,atts){
const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({message:text,previousResponseId:prevId,attachments:atts})});
const data=await r.json();
if(!r.ok)throw new Error(data.error||'Backend request failed');
return data;
}
function speak(t){
if(!('speechSynthesis' in window))return;
speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t));
}
async function ask(text){
text=String(text).trim();if(!text&&!picked.length)return;
const files=picked;picked=[];renderTray();
if(!text)text='Please look at the attached file.';
let sent=text;
files.filter(f=>f.kind==='text').forEach(f=>{sent+='\n\n[File: '+f.name+']\n'+f.text});
const atts=files.filter(f=>f.kind!=='text').map(f=>({name:f.name,type:f.type,data:f.data}));
const shown=files.length?text+'\n📎 '+files.map(f=>f.name).join(', '):text;
showHome(false);
if(!current){
current={id:String(Date.now()),title:text.slice(0,40),messages:[],lastId:null};
chats.unshift({id:current.id,title:current.title,updated:Date.now()});
}
const c=current;
c.messages.push({who:'user',text:shown,time:now()});
renderHistory();
addMsg(shown,'user');input.value='';send.disabled=true;
const pending=addMsg('','bot');
pending.querySelector('.txt').innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
let reply,ok=false;
try{
const d=await getReply(sent,c.lastId,atts);
c.lastId=d.id;reply=d.reply;ok=true;
c.messages.push({who:'bot',text:reply,time:now()});
}catch(e){reply='Something went wrong. Check your connection and try again.'}
if(current===c)setBot(pending,reply);
if(ok&&voiceMode)speak(reply);
const meta=chats.find(x=>x.id===c.id);
if(meta){meta.updated=Date.now();meta.title=c.title}
chats.sort((a,b)=>b.updated-a.updated);
renderHistory();
saveChat(c);
send.disabled=false;toBottom();
}
$('form').addEventListener('submit',e=>{e.preventDefault();voiceMode=false;ask(input.value)});

/* Voice */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){mic.style.display='none';document.querySelector('.sep').style.display='none'}else{
const rec=new SR();rec.lang='en-IN';rec.interimResults=false;
rec.onresult=e=>{voiceMode=true;ask(e.results[0][0].transcript)};
rec.onend=()=>mic.classList.remove('on');
rec.onerror=()=>mic.classList.remove('on');
mic.onclick=()=>{
if('speechSynthesis' in window)speechSynthesis.cancel();
if(mic.classList.contains('on')){rec.stop();return}
mic.classList.add('on');
try{rec.start()}catch(e){mic.classList.remove('on')}
};
}
renderHistory();
try{localStorage.setItem('tushar_migrated','1')}catch(e){}
loadList();
</script>
