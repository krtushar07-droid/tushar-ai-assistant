<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tushar AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d10;
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

.header {
    height: 65px;
    border-bottom: 1px solid #25282d;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-size: 20px;
    font-weight: bold;
}

.logo {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6d5dfc, #00c6ff);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
    font-weight: bold;
}

.container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 900px;
    width: 100%;
    margin: auto;
    overflow: hidden;
}

.welcome {
    text-align: center;
    margin-top: 90px;
    padding: 20px;
}

.welcome h1 {
    font-size: 34px;
    margin-bottom: 12px;
}

.welcome p {
    color: #9da3ad;
    font-size: 16px;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px 20px;
}

.message {
    margin-bottom: 20px;
    line-height: 1.6;
    padding: 14px 17px;
    border-radius: 14px;
    max-width: 80%;
}

.user {
    background: #252a33;
    margin-left: auto;
}

.ai {
    background: #15181d;
    border: 1px solid #272b31;
    margin-right: auto;
}

.input-area {
    padding: 15px 20px 25px;
}

.input-box {
    display: flex;
    align-items: center;
    background: #171a1f;
    border: 1px solid #343941;
    border-radius: 18px;
    padding: 8px;
}

input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 16px;
    padding: 12px;
}

button {
    border: none;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #ffffff;
    color: #000000;
    font-size: 20px;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

.footer {
    text-align: center;
    color: #6f7680;
    font-size: 12px;
    padding-bottom: 8px;
}

@media (max-width: 600px) {
    .welcome {
        margin-top: 60px;
    }

    .welcome h1 {
        font-size: 28px;
    }

    .message {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">T</div>
    Tushar AI
</div>

<div class="container">

    <div class="welcome" id="welcome">
        <h1>How can I help you?</h1>
        <p>Your personal AI assistant powered by Microsoft Azure</p>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-area">
        <div class="input-box">
            <input
                type="text"
                id="messageInput"
                placeholder="Message Tushar AI..."
                onkeydown="handleKey(event)"
            >
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div class="footer">
        Tushar AI • Powered by Microsoft Azure
    </div>

</div>

<script>

function handleKey(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
}

function sendMessage() {

    const input = document.getElementById("messageInput");
    const message = input.value.trim();

    if (!message) return;

    document.getElementById("welcome").style.display = "none";

    const chat = document.getElementById("chat");

    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = message;

    chat.appendChild(userMessage);

    input.value = "";

    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";
    aiMessage.textContent =
        "I'm connected to the website, but my Azure AI connection hasn't been added yet. We'll connect your Microsoft Foundry agent next.";

    chat.appendChild(aiMessage);

    chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
