<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tushar AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #090b0f;
    --panel: #11141a;
    --panel2: #181c23;
    --border: #292e37;
    --text: #f5f7fa;
    --muted: #8d95a3;
    --accent: #6c63ff;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* HEADER */

.header {
    height: 68px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 22px;
    background: rgba(9, 11, 15, 0.96);
}

.logo {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #6c63ff, #00b8ff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    margin-right: 12px;
}

.brand {
    font-size: 20px;
    font-weight: 700;
}

.status {
    margin-left: 10px;
    width: 8px;
    height: 8px;
    background: #36d399;
    border-radius: 50%;
}

/* MAIN */

.main {
    width: 100%;
    max-width: 900px;
    margin: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 30px 18px 0;
    overflow: hidden;
}

.welcome {
    text-align: center;
    padding: 55px 10px 30px;
}

.welcome h1 {
    font-size: clamp(30px, 7vw, 46px);
    margin-bottom: 14px;
    letter-spacing: -1px;
}

.welcome p {
    color: var(--muted);
    font-size: 16px;
}

/* QUICK ACTIONS */

.actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin: 10px 0 25px;
}

.action {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 17px;
    color: var(--text);
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
}

.action:hover {
    background: var(--panel2);
    border-color: #454c58;
    transform: translateY(-1px);
}

.action-title {
    font-weight: 600;
    margin-bottom: 6px;
}

.action-text {
    color: var(--muted);
    font-size: 13px;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px 4px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.message {
    max-width: 82%;
    padding: 13px 16px;
    border-radius: 16px;
    line-height: 1.55;
    font-size: 15px;
    animation: appear 0.2s ease;
}

.user {
    align-self: flex-end;
    background: #292e38;
    border-bottom-right-radius: 5px;
}

.ai {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* TYPING */

.typing {
    display: flex;
    gap: 4px;
    align-items: center;
}

.dot {
    width: 6px;
    height: 6px;
    background: #89919e;
    border-radius: 50%;
    animation: blink 1.2s infinite;
}

.dot:nth-child(2) {
    animation-delay: 0.15s;
}

.dot:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes blink {
    0%, 80%, 100% {
        opacity: 0.25;
    }

    40% {
        opacity: 1;
    }
}

/* INPUT */

.input-area {
    padding: 12px 0 8px;
}

.input-box {
    display: flex;
    align-items: center;
    background: var(--panel);
    border: 1px solid #363c46;
    border-radius: 20px;
    padding: 7px 8px 7px 16px;
    box-shadow: 0 5px 30px rgba(0,0,0,0.25);
}
    </style>

</head>

<body>

<div style="min-height:100vh; display:flex; flex-direction:column;">

    <!-- HEADER -->
    <header style="
        height:64px;
        display:flex;
        align-items:center;
        padding:0 20px;
        border-bottom:1px solid var(--border);
        background:var(--panel);
        flex-shrink:0;
    ">
        <div style="
            width:38px;
            height:38px;
            border-radius:50%;
            background:#111827;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:bold;
            color:#ffffff;
            margin-right:12px;
        ">
            T
        </div>

        <div>
            <div style="font-size:18px;font-weight:600;">
                Tushar AI
            </div>
            <div style="font-size:11px;color:#89919e;">
                Personal AI Assistant
            </div>
        </div>
    </header>


    <!-- CHAT AREA -->
    <main id="chat" style="
        flex:1;
        overflow-y:auto;
        padding:24px 16px 120px;
        max-width:900px;
        width:100%;
        margin:auto;
    ">

        <!-- WELCOME SCREEN -->
        <div id="welcome" style="
            min-height:60vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-align:center;
        ">

            <div style="
                width:70px;
                height:70px;
                border-radius:50%;
                background:#111827;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:30px;
                font-weight:bold;
                margin-bottom:22px;
            ">
                T
            </div>

            <h1 style="
                font-size:32px;
                margin:0 0 12px;
            ">
                How can I help you?
            </h1>

            <p style="
                color:#89919e;
                font-size:16px;
                margin:0;
            ">
                Your personal AI assistant powered by Microsoft Azure
            </p>

            <p style="
                color:#626b78;
                font-size:13px;
                margin-top:12px;
            ">
                Ask me anything to get started.
            </p>

        </div>

    </main>


    <!-- INPUT -->
    <div class="input-area" style="
        position:fixed;
        bottom:0;
        left:0;
        right:0;
        background:linear-gradient(
            transparent,
            var(--bg) 25%
        );
        padding:30px 16px 20px;
    ">

        <div class="input-box" style="
            max-width:850px;
            margin:auto;
        ">

            <input
                id="messageInput"
                type="text"
                placeholder="Message Tushar AI..."
                autocomplete="off"
                style="
                    flex:1;
                    border:none;
                    outline:none;
                    background:transparent;
                    color:white;
                    font-size:16px;
                    padding:10px;
                "
            />

            <button
                onclick="sendMessage()"
                style="
                    width:48px;
                    height:48px;
                    border:none;
                    border-radius:50%;
                    background:#ffffff;
                    color:#000000;
                    font-size:22px;
                    cursor:pointer;
                "
            >
                ➤
            </button>

        </div>

    </div>

</div>


<script>

function sendMessage() {

    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");

    const message = input.value.trim();

    if (!message) return;

    // Remove welcome screen
    if (welcome) {
        welcome.remove();
    }

    // USER MESSAGE
    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = message;

    chat.appendChild(userMessage);

    input.value = "";

    // Typing indicator
    const typing = document.createElement("div");
    typing.className = "message ai";
    typing.innerHTML = `
        <div class="typing">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    `;

    chat.appendChild(typing);

    chat.scrollTop = chat.scrollHeight;


    // Temporary AI response
    setTimeout(() => {

        typing.remove();

        const aiMessage = document.createElement("div");
        aiMessage.className = "message ai";

        aiMessage.textContent =
            "I'm connected to the Tushar AI interface. The Azure AI backend will be connected next.";

        chat.appendChild(aiMessage);

        chat.scrollTop = chat.scrollHeight;

    }, 1200);
}


// Press Enter to send
document.getElementById("messageInput").addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
