<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tushar AI</title>
<style>
:root{
  --bg:#070b17; --panel:#0c1224; --card:#111933; --line:#26304d;
  --text:#f4f6ff; --muted:#a3adc8; --blue:#2f5bff; --blue2:#2448e6;
  --grad:linear-gradient(135deg,#2563ff,#8b3dff);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
  background-image:radial-gradient(900px 500px at 50% -10%,#16204a 0%,transparent 70%);}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:flex;height:100%;padding-top:env(safe-area-inset-top,0)}
.side{width:260px;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:none;flex-direction:column;gap:6px}
.new{display:flex;align-items:center;gap:10px;background:var(--blue);padding:12px 14px;border-radius:10px;font-weight:600;margin-bottom:12px}
.new:hover{background:var(--blue2)}
.hist{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;color:var(--text);text-align:left}
.hist:hover{background:var(--card)}
.hist svg{color:#6f8bff}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:22px;flex:none}
.brand{font-size:22px;font-weight:700}
.nav{display:none;margin-left:auto;gap:28px;color:var(--muted)}
.nav a{padding:6px 0;text-decoration:none;color:inherit}
.nav a.on{color:#7d9bff;border-bottom:2px solid #7d9bff}
.menu{margin-left:auto}

#chat{flex:1;overflow-y:auto;padding:28px 18px 12px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
.wrap{width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{text-align:center;padding:6px 0 4px}
.hero h1{font-size:clamp(30px,6vw,40px);font-weight:700;letter-spacing:-.01em}
.hero p{color:var(--muted);margin-top:12px;font-size:clamp(16px,3.6vw,18px);line-height:1.45}

.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid #1b2547;border-radius:14px;padding:16px;text-align:left;line-height:1.3;font-size:15px;transition:border-color .15s,background .15s}
.chip:hover{border-color:#3a4b8f;background:#141e3d}
.chip svg{flex:none;width:26px;height:26px}
.c1{color:#4d7bff}.c2{color:#cfd6ee}.c3{color:#f5b942}.c4{color:#8b7bff}
.chip span{color:var(--text)}

.row{display:flex;gap:12px;align-items:flex-end}
.row.user{justify-content:flex-end}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700}
.av.bot{background:var(--grad)}
.av.me{background:#232c47;color:#c5cde6}
.bubble{max-width:min(78%,640px);padding:13px 16px;border-radius:18px;line-height:1.5;font-size:16px;white-space:pre-wrap;word-wrap:break-word}
.user .bubble{background:var(--blue);border-bottom-right-radius:6px}
.bot .bubble{background:var(--card);border-bottom-left-radius:6px}
.time{display:block;font-size:12px;margin-top:6px;opacity:.6}

form{padding:10px 18px calc(16px + env(safe-area-inset-bottom,0))}
.bar{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar input{flex:1;min-width:0;height:56px;border-radius:999px;border:1.5px solid #3a4468;background:transparent;color:var(--text);padding:0 24px;font:inherit;font-size:16px;outline:none}
.bar input::placeholder{color:#8a94b3}
.bar input:focus{border-color:#7d9bff}
.send{width:56px;height:56px;border-radius:50%;background:#fff;color:#0b1020;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.5}
.send svg{fill:currentColor;stroke:none;width:24px;height:24px}

@media(min-width:900px){
  .side{display:flex}
  .menu{display:none}
  .nav{display:flex}
  .chips{grid-template-columns:repeat(4,1fr)}
  .chip{font-size:14px;padding:14px}
  .chip svg{width:22px;height:22px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <button class="new" id="newChat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New Chat</button>
    <button class="hist"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Marketing strategy</button>
    <button class="hist"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5zM6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/></svg>MBA concepts</button>
    <button class="hist"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/></svg>Business ideas</button>
    <button class="hist"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5M9 13h6M9 17h6"/></svg>Industry analysis</button>
    <button class="hist"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5M9 13h6M9 17h6"/></svg>Summarize document</button>
  </aside>

  <div class="main">
    <header>
      <div class="logo">T</div>
      <div class="brand">Tushar AI</div>
      <nav class="nav"><a href="#">Home</a><a href="#" class="on">Chat</a><a href="#">About</a></nav>
      <button class="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </header>

    <div id="chat"><div class="wrap" id="wrap">
      <div class="hero" id="hero">
        <h1>How can I help you?</h1>
        <p>Your personal AI assistant powered<br>by Microsoft Azure</p>
      </div>
      <div class="chips" id="chips">
        <button class="chip c1"><svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-9"/></svg><span>Help me with marketing strategies</span></button>
        <button class="chip c2"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5M9 13h6M9 17h6"/></svg><span>Summarize this content</span></button>
        <button class="chip c3"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/></svg><span>Give me business ideas</span></button>
        <button class="chip c4"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5zM6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/></svg><span>Help me with MBA concepts</span></button>
      </div>
    </div></div>

    <form id="form" autocomplete="off">
      <div class="bar">
        <input id="input" placeholder="Message Tushar AI..." aria-label="Message Tushar AI">
        <button class="send" id="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/></svg></button>
      </div>
    </form>
  </div>
</div>

<script>
const wrap = document.getElementById('wrap'), chat = document.getElementById('chat'),
      input = document.getElementById('input'), form = document.getElementById('form'),
      send = document.getElementById('send');
const now = () => new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});

function addMsg(text, who){
  const row = document.createElement('div'); row.className = 'row ' + who;
  const av = `<div class="av ${who==='user'?'me':'bot'}">${who==='user'?'<svg viewBox="0 0 24 24" style="width:20px"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>':'T'}</div>`;
  const b = document.createElement('div'); b.className = 'bubble';
  b.textContent = text;
  const t = document.createElement('span'); t.className = 'time'; t.textContent = now();
  b.appendChild(t);
  row.innerHTML = who === 'user' ? '' : av;
  row.appendChild(b);
  if (who === 'user') row.insertAdjacentHTML('beforeend', av);
  wrap.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return b;
}

/* ====== CONNECT YOUR BACKEND HERE ======
   Replace the body of getReply() with your Azure call, e.g.
   const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:text})});
   return (await r.json()).reply;
*/
async function getReply(text){
  const r = await fetch('https://tushar-ai-backend.azurewebsites.net/api/chat', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: text
    })
  });

  const data = await r.json();

  if (!r.ok) {
    throw new Error(data.error || 'Backend request failed');
  }

  return data.reply;
                }

async function ask(text){
  text = text.trim(); if (!text) return;
  document.getElementById('chips').style.display = 'none';
  addMsg(text, 'user'); input.value = ''; send.disabled = true;
  const pending = addMsg('…', 'bot');
  try {
    const reply = await getReply(text);
    pending.firstChild.textContent = reply;
  } catch (e) {
    pending.firstChild.textContent = 'Something went wrong. Check your connection and try again.';
  }
  send.disabled = false; chat.scrollTop = chat.scrollHeight;
}

form.addEventListener('submit', e => { e.preventDefault(); ask(input.value); });
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => ask(c.innerText)));
document.getElementById('newChat').addEventListener('click', () => {
  wrap.querySelectorAll('.row').forEach(r => r.remove());
  document.getElementById('chips').style.display = '';
});
</script>
</body>
</html>
